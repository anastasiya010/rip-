services:
  postgres:
    image: postgres:16
    platform: linux/amd64 
    container_name: lab2_postgres
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: medication_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lab2_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d medication_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    platform: linux/amd64 
    container_name: lab2_adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    networks:
      - lab2_network
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  postgres_data:

networks:
  lab2_network:
    driver: bridge

