{{ define "content" }}
<section class="toolbar">
    <form method="get" action="/medicine-catalog" class="filter-form">
        <label class="filter-label">Выберите категорию лекарства</label>
        <select name="cat" class="filter-select">
            <option value="">Все категории</option>
            {{ range .Categories }}
            <option value="{{ . }}" {{ if eq $.SelectedCategory . }}selected{{ end }}>{{ . }}</option>
            {{ end }}
        </select>
        <label class="filter-label">Производитель</label>
        <select name="man" class="filter-select">
            <option value="">Все производители</option>
            {{ range .Manufacturers }}
            <option value="{{ . }}" {{ if eq $.SelectedManufacturer . }}selected{{ end }}>{{ . }}</option>
            {{ end }}
        </select>
        <button type="submit" class="btn">Показать лекарства</button>
    </form>
    <a class="basket" href="/prescription?id={{ .Prescription.ID }}" title="Рецепт">
        🧺 <span>В рецепте: {{ .PrescriptionCount }}</span>
    </a>
    <div class="manufacturers-hint"></div>
    <div class="manufacturers-bar"></div>
</section>

<section class="card-grid">
    {{ range .Medicines }}
    <article class="card">
        <a href="/medicine?id={{ .ID }}" class="card-link">
            <img src="{{ call $.ImageURL .ImageKey }}" alt="{{ .Name }}" class="card-img"/>
            <div class="card-body">
                <h3 class="card-title">{{ .Name }}</h3>
                <div class="card-meta">Категория: {{ .Category }}</div>
                <div class="card-meta">Производитель: {{ .Manufacturer }}</div>
                <p class="card-text">{{ .ShortInfo }}</p>
            </div>
        </a>
        <div class="card-actions">
            <form method="post" action="/cart/add?id={{ .ID }}">
                <button type="submit" class="btn">Добавить в корзину</button>
            </form>
            <a href="/medicine?id={{ .ID }}" class="btn" style="margin-left:8px;">Подробнее</a>
        </div>
    </article>
    {{ end }}
</section>
{{ end }}
