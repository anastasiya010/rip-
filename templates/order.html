{{ define "content" }}
<section class="order">
    <h2 class="section-title">Рецепт</h2>

    <div class="order-card">
        <div class="order-fields-row">
            <div class="field"><span class="label">Имя ребенка</span><span class="value">Алиса</span></div>
            <div class="field"><span class="label">Пол</span><span class="value">Женский</span></div>
            <div class="field"><span class="label">Вес</span><span class="value">32</span></div>
            <div class="field"><span class="label">Возраст</span><span class="value">8</span></div>
        </div>
    </div>

    <div class="order-list">
        {{ range .Prescription.Items }}
        <article class="order-row">
            <img src="{{ call $.ImageURL .ImageKey }}" alt="{{ .MedicineName }}" class="row-img"/>
            <div class="row-name">{{ .MedicineName }}</div>
            <div class="row-result">Количество: {{ .Quantity }}</div>
            <div class="row-mm">
                <form method="post" action="/cart/remove?id={{ .MedicineID }}">
                    <button type="submit" class="btn">Удалить</button>
                </form>
            </div>
        </article>
        {{ end }}
    </div>

    <div style="margin-top:16px;">
        <form method="post" action="/cart/clear">
            <button type="submit" class="btn">Очистить рецепт</button>
        </form>
    </div>
</section>
{{ end }}
